name: Quick Verify (Kotlin compile only)

# 快速验证通道：只做 Kotlin 编译，不跑 R8/打包，用于「代码能不能过」这一步。
# 目标耗时 3-6 分钟，比完整 APK 构建（~19 分钟）快 4 倍以上。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> $GITHUB_ENV
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Install SDK components
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMAN=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMAN" ]; then SDKMAN="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMAN" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" >/dev/null 2>&1 || true
          yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "signing.storeFile=$HOME/.android/debug.keystore" >> local.properties
          echo "signing.storePassword=android" >> local.properties
          echo "signing.keyAlias=androiddebugkey" >> local.properties
          echo "signing.keyPassword=android" >> local.properties
      - name: Grant gradlew permission
        run: chmod +x gradlew
      - name: Use official maven repos
        run: sed -i '/maven.aliyun.com/d' settings.gradle.kts
      # 诊断：打印可用 JDK 及其 vendor 字符串。
      - name: Diagnose available JDKs
        run: |
          echo "=== java -version ==="
          java -version 2>&1 || true
          echo "=== JAVA_HOME=$JAVA_HOME ==="
          cat "$JAVA_HOME/release" 2>/dev/null || true
      # 关键修复：某些 Gradle 插件在二进制里写死了
      # toolchain {languageVersion=21, vendor=Oracle}。Gradle 8.x 对 vendor 是
      # 字面匹配，而 runner 上 Temurin 的 `java.vendor` = "Eclipse Adoptium"
      # → 报 "Cannot find a Java installation ... vendor=Oracle"。
      #
      # Gradle 探测 toolchain 时会实际启动 JDK 读取 java.vendor 系统属性，
      # 因此这里通过 JAVA_TOOL_OPTIONS 覆盖该属性（不改项目代码）。
      - name: Force java.vendor=Oracle for toolchain detection
        run: |
          echo "JAVA_TOOL_OPTIONS=-Djava.vendor=Oracle -Djava.vendor.url=http://java.oracle.com/" >> $GITHUB_ENV
          echo "--- verify override ---"
          java -XshowSettings:properties -version 2>&1 | grep -E 'java\.vendor' || true
      # 只编 Kotlin：跳过 R8 / dex / 资源打包 / 签名，编译错误仍会暴露
      - name: Verify Kotlin compile (official)
        run: |
          ./gradlew :manager:compileOfficialReleaseKotlin \
            --console=plain --parallel --build-cache \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:+TieredCompilation -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8"
      - name: Verify Kotlin compile (manages)
        run: |
          ./gradlew :manager:compileManagesReleaseKotlin \
            --console=plain --parallel --build-cache \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:+TieredCompilation -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8"
