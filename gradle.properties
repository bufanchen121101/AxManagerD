## Gradle 构建配置（ARM aarch64 环境）
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-arm64
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 禁用 AAPT2 daemon（qemu 转译下 daemon 通信不稳定，直接调用更可靠）
android.enableAapt2Daemon=false
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/36.0.0/aapt2
