name: Quick Verify (Kotlin compile only)

# 快速验证通道：只做 Kotlin 编译，不跑 R8/打包，用于「代码能不能过」这一步。
# 目标耗时 3-6 分钟，比完整 APK 构建（~19 分钟）快 4 倍以上。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> $GITHUB_ENV
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Install SDK components
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMAN=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMAN" ]; then SDKMAN="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMAN" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" >/dev/null 2>&1 || true
          yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "signing.storeFile=$HOME/.android/debug.keystore" >> local.properties
          echo "signing.storePassword=android" >> local.properties
          echo "signing.keyAlias=androiddebugkey" >> local.properties
          echo "signing.keyPassword=android" >> local.properties
      - name: Grant gradlew permission
        run: chmod +x gradlew
      - name: Add swap (OOM guard)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -m
      - name: Use official maven repos
        run: sed -i '/maven.aliyun.com/d' settings.gradle.kts
      # 诊断：打印可用 JDK 及其 vendor 字符串。
      - name: Diagnose available JDKs
        run: |
          echo "=== java -version ==="
          java -version 2>&1 || true
          echo "=== JAVA_HOME=$JAVA_HOME ==="
          cat "$JAVA_HOME/release" 2>/dev/null || true
      # 关键修复：Gradle 8.x 对 toolchain 的 vendor 是**字面匹配**，runner 上是
      # Temurin（java.vendor="Eclipse Adoptium"），一旦有任何地方要求 vendor=Oracle
      # 就会报 "Cannot find a Java installation ... vendor=Oracle"。
      #
      # 实测：改 <JDK>/release 的 IMPLEMENTOR、JAVA_TOOL_OPTIONS -Djava.vendor
      # 都无效（Gradle 走的是 JVM 只读属性），因此这里尝试装一份 Oracle JDK 21。
      #
      # 注意：Oracle 已撤掉 /java/21/latest/ 路径（返回 404），必须用 archive 固定版本；
      # 且这一步**不允许让整个 job 失败**——装不上就回退到预装的 Temurin 21。
      - name: Install Oracle JDK 21 (vendor match, best-effort)
        run: |
          BASE="https://download.oracle.com/java/21"
          CANDIDATES="$BASE/latest/jdk-21_linux-x64_bin.tar.gz
          $BASE/archive/jdk-21.0.9_linux-x64_bin.tar.gz
          $BASE/archive/jdk-21.0.8_linux-x64_bin.tar.gz
          $BASE/archive/jdk-21.0.5_linux-x64_bin.tar.gz"
          GOT=""
          for U in $CANDIDATES; do
            echo "trying $U"
            if curl -fsSL --retry 2 --max-time 300 -o /tmp/oracle-jdk21.tar.gz "$U"; then GOT="$U"; break; fi
            echo "  -> failed"
          done
          if [ -z "$GOT" ]; then
            echo "::warning::Oracle JDK 21 全部下载地址不可用，回退到预装的 Temurin JDK 21"
            exit 0
          fi
          echo "downloaded from $GOT"
          sudo mkdir -p /opt/oracle-jdk
          sudo tar -xzf /tmp/oracle-jdk21.tar.gz -C /opt/oracle-jdk --strip-components=1
          ORACLE_HOME=$(find /opt/oracle-jdk -maxdepth 2 -name release -printf '%h\n' 2>/dev/null | head -1)
          if [ -z "$ORACLE_HOME" ]; then
            echo "::warning::Oracle JDK 解包后未找到 release 文件，回退到 Temurin"
            exit 0
          fi
          echo "ORACLE_HOME=$ORACLE_HOME"
          grep -E '^(IMPLEMENTOR|JAVA_VERSION)=' "$ORACLE_HOME/release" || true
          "$ORACLE_HOME/bin/java" -version 2>&1 || true
          echo "JAVA_HOME=$ORACLE_HOME" >> $GITHUB_ENV
          echo "ORG_GRADLE_PROJECT_java.home=$ORACLE_HOME" >> $GITHUB_ENV
          echo "$ORACLE_HOME/bin" >> $GITHUB_PATH
      # 只编 Kotlin：跳过 R8 / dex / 资源打包 / 签名，编译错误仍会暴露
      - name: Verify Kotlin compile (official)
        run: |
          ./gradlew :manager:compileOfficialReleaseKotlin \
            --console=plain --build-cache \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:+TieredCompilation -XX:ReservedCodeCacheSize=512m -XX:CICompilerCount=2 -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:+TieredCompilation -Dfile.encoding=UTF-8"
      - name: Verify Kotlin compile (manages)
        run: |
          ./gradlew :manager:compileManagesReleaseKotlin \
            --console=plain --build-cache \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:+TieredCompilation -XX:ReservedCodeCacheSize=512m -XX:CICompilerCount=2 -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:+TieredCompilation -Dfile.encoding=UTF-8"
