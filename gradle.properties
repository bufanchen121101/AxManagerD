org.gradle.jvmargs=-Xmx4608m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m -XX:CICompilerCount=1 -XX:-TieredCompilation -XX:ActiveProcessorCount=4 -Dcom.android.tools.r8.thread.count=1
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.enableAapt2Daemon=false
# NOTE: 1536m was too small. When both flavors are built in one job (flavor=both),
# :manager:compileManagesReleaseKotlin and :manager:compileOfficialReleaseKotlin run
# one after another and reuse the same Kotlin compile daemon, so the daemon heap must
# hold the whole compile. With -Xmx1536m the second compile died with
# "e: java.lang.OutOfMemoryError: GC overhead limit exceeded" (stack top: ClassWriter.toByteArray
# / JvmWriteOutputsPhase) and the build failed with
# "Not enough memory to run compilation. Try to increase it via 'gradle.properties'".
# Runner has 16G RAM and the Gradle JVM is capped at 4608m, so 3072m is safe.
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:CICompilerCount=1 -XX:-TieredCompilation -XX:ActiveProcessorCount=4
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true
